<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lang App — изучение английского</title>
        <style>
            .startup {
                max-width: 32rem;
                padding: 1.5rem;
                margin: 10vh auto;
                font-family: system-ui, sans-serif;
                text-align: center;
            }
        </style>
        <script>
            window.addEventListener(
                "error",
                event => {
                    if (!(event.target instanceof HTMLScriptElement)) return;
                    const showStartupError = () => {
                        const loading = document.getElementById("startup-loading");
                        const errorPanel = document.getElementById("startup-error");
                        if (loading) loading.hidden = true;
                        if (errorPanel) errorPanel.hidden = false;
                    };
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", showStartupError, { once: true });
                    } else {
                        showStartupError();
                    }
                },
                true,
            );
        </script>
    </head>
    <body>
        <div id="root">
            <div class="startup">
                <p id="startup-loading" role="status">Загрузка приложения…</p>
                <div id="startup-error" role="alert" hidden>
                    <h1>Не удалось загрузить приложение</h1>
                    <p>Проверьте подключение к интернету и обновите страницу.</p>
                    <button type="button" onclick="window.location.reload()">Обновить страницу</button>
                </div>
                <noscript>Включите JavaScript, чтобы пользоваться приложением.</noscript>
            </div>
        </div>
        <script type="module" src="/src/bootstrap.ts"></script>
    </body>
</html>
